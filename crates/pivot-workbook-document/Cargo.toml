[package]
name = "pivot-workbook-document"
version.workspace = true
edition.workspace = true
publish.workspace = true
[dependencies]
pivot-core = { path = "../pivot-core" }
pivot-workbook = { path = "../pivot-workbook" }
pivot-storage = { path = "../pivot-storage" }
pivot-types = { path = "../pivot-types" }
uuid = { version = "1.28.0", features = ["v4"] }
sha2 = "0.10"

[features]
history-experiment = ["pivot-workbook/history-experiment", "pivot-storage/history-experiment"]

[[example]]
name = "history_association"
required-features = ["history-experiment"]
