[package]
name = "pivot-storage"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
pivot-core = { path = "../pivot-core" }
pivot-types = { path = "../pivot-types" }
uuid = { version = "1.28.0", features = ["v4"] }

sha2 = "0.10"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
