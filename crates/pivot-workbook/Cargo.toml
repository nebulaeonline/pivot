[package]
name = "pivot-workbook"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
pivot-core = { path = "../pivot-core" }
pivot-types = { path = "../pivot-types" }
uuid = { version = "1.28.0", features = ["v4"] }

[features]
history-experiment = ["pivot-core/history-experiment"]
scaling-experiment = ["pivot-core/scaling-experiment"]

[[example]]
name = "bulk"
required-features = ["scaling-experiment"]

[[example]]
name = "readiness"
required-features = ["scaling-experiment"]

[[example]]
name = "history_feasibility"
required-features = ["history-experiment"]
