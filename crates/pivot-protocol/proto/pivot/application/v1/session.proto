syntax = "proto3";
package pivot.application.v1;
option csharp_namespace = "Pivot.Protocol.Application.V1";
import "pivot/v1/types.proto";

// Owned local child-session protocol. One request in flight, no replay/reconnect.
message Position { uint32 row = 1; uint32 column = 2; }
message Edit {
  Position at = 1;
  oneof action {
    pivot.v1.Decimal128 number = 2;
    string formula = 3;
    bool clear = 4;
    Position move_to = 5;
    string text = 6;
    string entry = 7;
    bool boolean = 8;
  }
}
message Request {
  uint32 version = 1;
  uint64 id = 2;
  // Opaque exact Expected identity, including session, sheet state and graph revision.
  string revision = 3;
  enum Operation { UNSPECIFIED = 0; CREATE = 1; APPLY = 2; READ = 3; CAPTURE = 4; CALCULATE = 5; RELEASE = 6; CLOSE = 7; NEW = 8; OPEN = 9; PREPARE_SAVE = 10; SAVE = 11; CLOSE_DOCUMENT = 12; COPY_BLOCK = 13; PASTE_BLOCK = 14; PROOF_START = 15; PROOF_PUBLISH = 16; PROOF_LAYOUT = 17; PROOF_READ = 18; PROOF_EVALUATE = 19; BINDING_START = 20; RESOLVE_FORMULA = 21; APPLY_FORMULA = 22; DUPLICATE_BLOCK = 23; RENAME_PRODUCER = 24; RETIRE_PRODUCER = 25; RECREATE_PRODUCER = 26; PUBLISH_UNAVAILABLE = 27; RENAME_OUTPUT = 28; RETIRE_OUTPUT = 29; RECREATE_OUTPUT = 30; FILL = 31; LIST_SHEETS = 32; ADD_SHEET = 33; RENAME_SHEET = 34; FORMAT = 35; READ_STYLES = 36; PREPARE_CSV_IMPORT = 37; IMPORT_CSV = 38; EXPORT_CSV = 39; CANCEL_CSV_IMPORT = 40; CSV_BOUNDS = 41; STRUCTURE = 42; SORT = 43; SORT_BOUNDS = 44; SET_FILTER = 45; READ_FILTERED = 46; REAPPLY_FILTER = 47; PREPARE_FILTERED_OPERATION = 48; VALIDATE_FILTER = 49; GET_FILTER = 50; COPY_VISIBLE = 51; PREPARE_VISIBLE_PASTE = 52; PASTE_VISIBLE = 53; }
  Operation operation = 4;
  repeated Edit edits = 5;
  Position first = 6;
  Position last = 7;
  string capture = 8;
  repeated Position outputs = 9;
  string path = 10;
  string save_ticket = 11;
  bool discard = 12;
  bytes clipboard = 13;
  bool native_clipboard = 14;
  uint32 proof_count = 15;
  uint64 proof_epoch = 16;
  uint64 proof_presentation = 17;
  string proof_projection = 18;
  uint32 proof_after_row = 19;
  bool proof_reverse = 20;
  string proof_key = 21;
  string computational_state = 22;
  string formula_source = 23;
  repeated TypedOccurrence occurrences = 24;
  Position destination_first = 25;
  Position destination_last = 26;
  string producer_name = 27;
  enum FillDirection { FILL_UNSPECIFIED = 0; UP = 1; DOWN = 2; LEFT = 3; RIGHT = 4; }
  FillDirection fill_direction = 28;
  string worksheet = 29;
  string sheet_name = 30;
  // Style.encode current 17-byte record; patch bits 0..9: numeric, places,
  // rounding, grouping, currency, bold, italic, alignment, foreground, background.
  // Unset bits Keep; a field Set to its default implements Reset.
  bytes style = 31;
  uint32 style_fields = 32;
  bool reset_format = 33;
  // CSV data stays in the owned Rust process; frames carry paths and tickets.
  bool csv_typed = 34;
  bool csv_convert_leading_zeros = 35;
  bool csv_recognize_quoted = 36;
  string csv_ticket = 37;
  bool csv_whole_sheet = 38;
  bool style_inherit = 39;
  bool worksheet_defaults = 40;
  bool style_summary = 41;
  bool structure_columns = 42;
  bool structure_delete = 43;
  uint32 structure_start = 44;
  uint32 structure_count = 45;
  bool sort_exclude_header = 46;
  bool sort_move_formatting = 47;
  repeated SortKey sort_keys = 48;
  FilterDefinition filter_definition = 49;
  uint32 filter_first_visible = 50;
  uint32 filter_row_count = 51;
  bytes filter_operation = 52;
  string filter_confirmation = 53;
  uint32 clipboard_kind = 54;
}
message FilterPredicate { uint32 operator = 1; oneof literal { pivot.v1.Decimal128 decimal = 2; string text = 3; bool boolean = 4; string decimal_text = 5; } }
message FilterCondition { uint32 column = 1; bool either = 2; repeated FilterPredicate predicates = 3; }
message FilterDefinition { Position first = 1; Position last = 2; bool exclude_header = 3; bool needs_review = 4; repeated FilterCondition conditions = 5; }
message FilterSummary { Position first = 1; Position last = 2; bool exclude_header = 3; bool needs_review = 4; repeated uint32 columns = 5; }
message FilterFootprint { Position first = 1; Position last = 2; }
message SortKey { uint32 column = 1; bool descending = 2; }
message TypedValue {
  oneof kind {
    pivot.v1.Decimal128 decimal = 1;
    bool boolean = 2;
    string text = 3;
    bool blank = 4;
  }
}
message Cell {
  Position at = 1;
  string cell_id = 2;
  string node_id = 3;
  oneof content { pivot.v1.Decimal128 number = 4; string formula = 5; bool blank = 6; string text = 9; bool boolean = 18; }
  pivot.v1.Decimal128 value = 7;
  string error = 8;
  string source_fault_id = 10;
  string source_fault_code = 11;
  string source_producer = 12;
  string source_output = 13;
  string source_producer_name = 14;
  string source_output_name = 15;
  string worksheet = 16;
  string authored_formula = 17;
  // Authoritative successful value, independently of definition. value field 7
  // is a Decimal-only convenience mirror and must agree when present.
  TypedValue result = 19;
  string error_code = 20;
  string formatted_number = 21;
}
message Response {
  uint32 version = 1;
  uint64 id = 2;
  string revision = 3;
  string generation = 4;
  string capture = 5;
  repeated Cell cells = 6;
  string error = 7;
  bool conflict = 8;
  uint64 execution_ns = 9;
  uint64 serialization_ns = 10;
  // CLOSE proves explicit runtime disposal; EOF also disposes but has no receipt.
  bool closed = 11;
  uint64 remaining_charge = 12;
  string document_id = 13;
  string path = 14;
  string saved_checkpoint = 15;
  bool dirty = 16;
  string save_ticket = 17;
  bool uncertain = 18;
  uint64 export_ns = 19;
  uint64 file_ns = 20;
  uint64 capture_ns = 21;
  uint64 encode_ns = 22;
  uint64 decode_ns = 23;
  uint64 restore_ns = 24;
  SelectionStats selection_stats = 25;
  bytes clipboard = 26;
  string clipboard_text = 27;
  Position pasted_first = 28;
  Position pasted_last = 29;
  bool proof_mode = 30;
  uint64 proof_epoch = 31;
  uint64 proof_presentation = 32;
  ProofFrame proof_view = 33;
  ProofEvaluation proof_value = 34;
  string computational_state = 35;
  bool binding_mode = 36;
  repeated TypedOccurrence occurrences = 37;
  string capture_state = 38;
  uint64 captured_source_epoch = 39;
  string captured_source_generation = 40;
  string capture_identity = 41;
  string worksheet = 42;
  repeated WorksheetInfo worksheets = 43;
  repeated StyledPosition styles = 44;
  string csv_ticket = 45;
  bool csv_all_quoted = 46;
  bool csv_has_content = 47;
  uint32 positioned_cells = 48;
  uint32 allocated_cell_identities = 49;
  uint32 positioned_cell_limit = 50;
  uint32 allocated_cell_identity_limit = 51;
  bytes summary_style = 52;
  uint32 mixed_style_fields = 53;
  uint32 format_regions = 54;
  uint32 format_region_limit = 55;
  uint64 format_bytes = 56;
  bytes worksheet_default_style = 57;
  bool structure_changed = 58;
  bool formatting_clipped = 59;
  uint32 structure_moved = 60;
  uint32 structure_retired = 61;
  uint64 structure_work = 62;
  bool sort_changed = 63;
  uint32 sort_moved_rows = 64;
  uint32 sort_moved_cells = 65;
  uint64 sort_work = 66;
  Position sort_suggested_first = 67;
  Position sort_suggested_last = 68;
  FilterDefinition filter_definition = 69;
  // 0 absent, 1 applied, 2 structural review, 3 pending, 4 operational suspension.
  uint32 filter_status = 70;
  string filter_generation = 71;
  string filter_error = 72;
  bytes filter_visible_mask = 73;
  repeated uint32 filter_rows = 74;
  uint32 filter_shown_data_rows = 75;
  uint32 filter_total_data_rows = 76;
  uint32 filter_total_visible_rows = 77;
  uint32 filter_first_visible = 78;
  string filter_confirmation = 79;
  uint32 filter_hidden_rows = 80;
  repeated FilterFootprint filter_footprints = 81;
  FilterSummary filter_summary = 82;
  repeated uint32 visible_rows = 83;
  uint32 visible_first_column = 84;
  uint32 visible_width = 85;
  uint32 visible_skipped_rows = 86;
  bool clipboard_text_available = 87;
  uint32 clipboard_kind = 88;
}

// Domain-accounted allocation traffic; excludes caller/process-wide allocations.
message SelectionStats {
 uint64 visited_index_nodes = 1;
 uint64 selection_candidates = 2;
 uint64 emitted_members = 3;
 uint64 points = 4;
 uint64 selections = 5;
 uint64 identities = 6;
 uint64 consumers = 7;
 uint64 invalidated_nodes = 8;
 uint64 allocation_count = 9;
 uint64 allocation_bytes = 10;
 uint64 domain_charge = 11;
 uint64 domain_peak = 12;
}

// Opt-in, in-memory ADR-0019 proof. These tagged locations are never worksheet edits.
message ProofPlacement { string id = 1; uint32 after_row = 2; bool reverse = 3; }
message ProofRow { uint32 kind = 1; uint32 ordinary_row = 2; string projection = 3; string key = 4; uint32 ordinal = 5; repeated string fields = 6; }
message ProofFrame { string producer = 1; string generation = 2; uint64 epoch = 3; uint64 presentation = 4; uint32 record_count = 5; repeated ProofPlacement placements = 6; repeated ProofRow rows = 7; string error = 8; string schema = 9; repeated string field_ids = 10; string output = 11; repeated string record_keys = 12; uint32 first_visual_row = 13; }
message ProofEvaluation { string generation = 1; uint64 epoch = 2; pivot.v1.Decimal128 total = 3; pivot.v1.Decimal128 taxed = 4; string error = 5; string description = 6; }

// Private opt-in ADR-0020 proof; no node/slot identities accepted from clients.
message TypedOccurrence {
 uint32 ordinal=1; uint32 start_byte=2; uint32 end_byte=3;
 string document=4; string producer=5; string output=6; uint32 expected_type=7;
}

message StyledPosition { Position at = 1; bytes style = 2; }

message WorksheetInfo { string id = 1; string name = 2; uint32 rows = 3; uint32 columns = 4; }
