[package]
name = "pivot-workbook"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
pivot-core = { path = "../pivot-core" }
pivot-types = { path = "../pivot-types" }
uuid = { version = "1.28.0", features = ["v4"] }

[features]
persistent-core = ["pivot-core/core-integration"]
scaling-experiment = ["pivot-core/scaling-experiment"]

[[example]]
name = "scaling"
required-features = ["scaling-experiment"]

[[example]]
name = "scaling-random"
required-features = ["scaling-experiment"]

[[example]]
name = "structural"
required-features = ["scaling-experiment"]

[[example]]
name = "structural-inputs"
required-features = ["scaling-experiment"]

[[example]]
name = "bulk"
required-features = ["persistent-core", "scaling-experiment"]

[[example]]
name = "readiness"
required-features = ["persistent-core", "scaling-experiment"]
