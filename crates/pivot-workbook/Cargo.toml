[package]
name = "pivot-workbook"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
pivot-core = { path = "../pivot-core" }
pivot-types = { path = "../pivot-types" }
uuid = { version = "1.28.0", features = ["v4"] }
sha2 = { version = "0.10", optional = true }

[features]
history-experiment = ["pivot-core/history-experiment", "dep:sha2"]
scaling-experiment = ["pivot-core/scaling-experiment"]

[[example]]
name = "bulk"
required-features = ["scaling-experiment"]

[[example]]
name = "readiness"
required-features = ["scaling-experiment"]

[[example]]
name = "history_feasibility"
required-features = ["history-experiment"]

[[example]]
name = "history_identity_inventory"
required-features = ["history-experiment"]

[[example]]
name = "history_representation"
required-features = ["history-experiment"]

[[example]]
name = "history_durability"
required-features = ["history-experiment"]

[[example]]
name = "history_record_producer"
required-features = ["history-experiment"]

[[example]]
name = "history_index_fixture"
required-features = ["history-experiment"]
