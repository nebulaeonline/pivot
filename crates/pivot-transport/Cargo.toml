[package]
name = "pivot-transport"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
[dev-dependencies]
pivot-protocol = { path = "../pivot-protocol" }
prost = "0.14.4"
